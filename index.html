<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omi Card Game - Sri Lanka</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes floatCard {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-card {
            animation: floatCard 0.4s ease-out forwards;
        }
        .card-shadow {
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="bg-emerald-950 text-white font-sans select-none min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SUIT & CARD DEFINITIONS ---
        const SUITS = ['SPADES', 'HEARTS', 'DIAMONDS', 'CLUBS'];
        const SUIT_SYMBOLS = {
            SPADES: '♠',
            HEARTS: '♥',
            DIAMONDS: '♦',
            CLUBS: '♣'
        };
        const SUIT_COLORS = {
            SPADES: 'text-gray-900',
            HEARTS: 'text-red-600',
            DIAMONDS: 'text-red-600',
            CLUBS: 'text-gray-900'
        };

        const RANKS = [
            { rank: '7', value: 7 },
            { rank: '8', value: 8 },
            { rank: '9', value: 9 },
            { rank: '10', value: 10 },
            { rank: 'J', value: 11 },
            { rank: 'Q', value: 12 },
            { rank: 'K', value: 13 },
            { rank: 'A', value: 14 }
        ];

        // Updated Player Names
        const PLAYER_NAMES = {
            0: 'ඔබ (You)',
            1: 'Sandu',
            2: 'Notiya (Partner)',
            3: 'Nima'
        };

        const createDeck = () => {
            const deck = [];
            SUITS.forEach(suit => {
                RANKS.forEach(({ rank, value }) => {
                    deck.push({ id: `${suit}-${rank}`, suit, rank, value });
                });
            });
            return deck;
        };

        const shuffleDeck = (deck) => {
            const shuffled = [...deck];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        function App() {
            const [hands, setHands] = useState({ 0: [], 1: [], 2: [], 3: [] });
            const [trump, setTrump] = useState(null);
            const [trumpMaker, setTrumpMaker] = useState(0);
            const [currentTurn, setCurrentTurn] = useState(0);
            const [currentTrick, setCurrentTrick] = useState([]);
            const [leadSuit, setLeadSuit] = useState(null);
            const [gameState, setGameState] = useState('SELECT_TRUMP'); // SELECT_TRUMP, PLAYING, ROUND_END
            const [teamScore, setTeamScore] = useState({ us: 0, them: 0 });
            const [tokens, setTokens] = useState({ us: 0, them: 0 });
            const [statusMessage, setStatusMessage] = useState('ක්‍රීඩාව ආරම්භ කිරීමට තුරුම්පුව (Trump) තෝරන්න.');

            // Start New Round
            const startNewRound = () => {
                const fullDeck = shuffleDeck(createDeck());
                const initialHands = {
                    0: fullDeck.slice(0, 4),
                    1: fullDeck.slice(4, 8),
                    2: fullDeck.slice(8, 12),
                    3: fullDeck.slice(12, 16)
                };

                setHands(initialHands);
                setCurrentTrick([]);
                setLeadSuit(null);
                setTeamScore({ us: 0, them: 0 });

                const nextMaker = ((trumpMaker + 1) % 4);
                setTrumpMaker(nextMaker);
                setCurrentTurn(nextMaker);

                if (nextMaker === 0) {
                    setGameState('SELECT_TRUMP');
                    setStatusMessage('ඔබ පළමු කොළ 4 ලබා ගත්තා. තුරුම්පු පාටක් තෝරන්න!');
                } else {
                    setGameState('SELECT_TRUMP');
                    setStatusMessage(`${PLAYER_NAMES[nextMaker]} තුරුම්පු තෝරමින් සිටී...`);
                    // Slower AI Trump Selection
                    setTimeout(() => autoSelectTrumpForAI(initialHands[nextMaker], nextMaker), 2200);
                }
            };

            useEffect(() => {
                startNewRound();
            }, []);

            // AI Trump selection
            const autoSelectTrumpForAI = (aiHand, maker) => {
                const counts = { SPADES: 0, HEARTS: 0, DIAMONDS: 0, CLUBS: 0 };
                aiHand.forEach(c => counts[c.suit]++);
                let bestSuit = 'SPADES';
                let max = -1;
                SUITS.forEach(s => {
                    if (counts[s] > max) {
                        max = counts[s];
                        bestSuit = s;
                    }
                });
                finishDealing(bestSuit, maker);
            };

            // Finish Dealing remaining 4 cards each
            const finishDealing = (selectedTrump, maker) => {
                setTrump(selectedTrump);
                const fullDeck = shuffleDeck(createDeck());
                
                setHands({
                    0: fullDeck.slice(0, 8),
                    1: fullDeck.slice(8, 16),
                    2: fullDeck.slice(16, 24),
                    3: fullDeck.slice(24, 32)
                });

                setGameState('PLAYING');
                setCurrentTurn(maker);
                setStatusMessage(`තුරුම්පුව: ${selectedTrump} ${SUIT_SYMBOLS[selectedTrump]} | පළමු කොළය දැමීමට ${PLAYER_NAMES[maker]} ට වාරය.`);
            };

            // Handle Human Trump Selection
            const handleSelectTrump = (suit) => {
                finishDealing(suit, 0);
            };

            // Valid moves helper
            const getValidCards = (playerHand, lead) => {
                if (!lead) return playerHand;
                const matchSuit = playerHand.filter(c => c.suit === lead);
                return matchSuit.length > 0 ? matchSuit : playerHand;
            };

            // Handle AI and Human turns with SLOWER speed
            useEffect(() => {
                if (gameState !== 'PLAYING') return;

                if (currentTurn !== 0) {
                    setStatusMessage(`${PLAYER_NAMES[currentTurn]} කොළයක් දමමින් සිටී...`);
                    // Increased delay to 2200ms so player can easily follow
                    const timer = setTimeout(() => {
                        playAITurn(currentTurn);
                    }, 2200);
                    return () => clearTimeout(timer);
                } else {
                    updateTurnStatus();
                }
            }, [currentTurn, gameState, currentTrick]);

            // Simplified Turn Status Message (No Strategy Advice)
            const updateTurnStatus = () => {
                if (currentTrick.length === 0) {
                    setStatusMessage('ඔබේ වාරය! කැමති කොළයක් දමන්න.');
                } else {
                    const leadCard = currentTrick[0].card;
                    const myHand = hands[0];
                    const hasLeadSuit = myHand.some(c => c.suit === leadCard.suit);

                    if (hasLeadSuit) {
                        setStatusMessage(`ඔබේ වාරය! (${leadCard.suit} ${SUIT_SYMBOLS[leadCard.suit]} පාටින් කොළයක් දමන්න)`);
                    } else {
                        setStatusMessage('ඔබේ වාරය! (අදාළ පාට නොමැත, කැමති කොළයක් දමන්න)');
                    }
                }
            };

            const playCard = (player, card) => {
                const updatedHand = hands[player].filter(c => c.id !== card.id);
                setHands(prev => ({ ...prev, [player]: updatedHand }));

                const newTrick = [...currentTrick, { player, card }];
                setCurrentTrick(newTrick);

                let activeLead = leadSuit;
                if (currentTrick.length === 0) {
                    activeLead = card.suit;
                    setLeadSuit(card.suit);
                }

                if (newTrick.length === 4) {
                    // Increased trick evaluation time to 2800ms so all 4 played cards are clearly visible on table
                    setTimeout(() => evaluateTrickWinner(newTrick, activeLead), 2800);
                } else {
                    setCurrentTurn(((player + 1) % 4));
                }
            };

            const playAITurn = (p) => {
                const aiHand = hands[p];
                const validCards = getValidCards(aiHand, leadSuit);
                let chosenCard = validCards[0];

                if (validCards.length > 1) {
                    chosenCard = validCards.reduce((prev, curr) => curr.value > prev.value ? curr : prev);
                }

                playCard(p, chosenCard);
            };

            const evaluateTrickWinner = (trick, lSuit) => {
                let winningCard = trick[0];

                for (let i = 1; i < trick.length; i++) {
                    const current = trick[i];
                    if (trump && current.card.suit === trump && winningCard.card.suit !== trump) {
                        winningCard = current;
                    } else if (current.card.suit === winningCard.card.suit) {
                        if (current.card.value > winningCard.card.value) {
                            winningCard = current;
                        }
                    }
                }

                const winner = winningCard.player;
                const isUs = winner === 0 || winner === 2;

                const newUs = isUs ? teamScore.us + 1 : teamScore.us;
                const newThem = !isUs ? teamScore.them + 1 : teamScore.them;

                setTeamScore({ us: newUs, them: newThem });
                setStatusMessage(`මෙම වටය ${PLAYER_NAMES[winner]} ජයග්‍රහණය කළා!`);

                setCurrentTrick([]);
                setLeadSuit(null);

                if (hands[0].length === 0) {
                    endRound(newUs, newThem);
                } else {
                    setCurrentTurn(winner);
                }
            };

            const endRound = (usTricks, themTricks) => {
                setGameState('ROUND_END');
                let msg = '';
                if (usTricks > themTricks) {
                    msg = `ඔබ සහ Notiya අත දිනුවා! (${usTricks} - ${themTricks})`;
                    setTokens(prev => ({ ...prev, us: prev.us + (usTricks >= 7 ? 2 : 1) }));
                } else if (themTricks > usTricks) {
                    msg = `Sandu & Nima අත දිනුවා! (${themTricks} - ${usTricks})`;
                    setTokens(prev => ({ ...prev, them: prev.them + (themTricks >= 7 ? 2 : 1) }));
                } else {
                    msg = 'සමබර වටයක්! (4 - 4)';
                }
                setStatusMessage(msg);
            };

            const handleHumanCardClick = (card) => {
                if (currentTurn !== 0 || gameState !== 'PLAYING') return;

                const validCards = getValidCards(hands[0], leadSuit);
                const isValid = validCards.some(c => c.id === card.id);

                if (!isValid) {
                    setStatusMessage(`වැරදි කොළයක්! ${leadSuit} ${SUIT_SYMBOLS[leadSuit]} පාටින් කොළයක් දමන්න.`);
                    return;
                }

                playCard(0, card);
            };

            // Player position styling for played cards in the center table
            const getCardPositionStyle = (player) => {
                switch(player) {
                    case 0: // You (South)
                        return 'bottom-3 left-1/2 -translate-x-1/2';
                    case 1: // Sandu (East/Right)
                        return 'right-3 top-1/2 -translate-y-1/2';
                    case 2: // Notiya (North/Top)
                        return 'top-3 left-1/2 -translate-x-1/2';
                    case 3: // Nima (West/Left)
                        return 'left-3 top-1/2 -translate-y-1/2';
                    default:
                        return '';
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-between p-3 sm:p-4 max-w-4xl mx-auto">
                    {/* SCOREBOARD */}
                    <header className="w-full bg-emerald-900/90 backdrop-blur rounded-2xl p-3 sm:p-4 border border-emerald-700 shadow-2xl flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div className="flex items-center space-x-3">
                            <div className="bg-amber-500 text-black p-2 rounded-xl text-xl font-black">🏆</div>
                            <div>
                                <h1 className="font-extrabold text-lg sm:text-xl tracking-wide text-amber-400">OMI CARD GAME</h1>
                                <p className="text-xs text-emerald-200">
                                    Tokens - ඔබ & Notiya: <span className="font-bold text-yellow-300">{tokens.us}</span> | Sandu & Nima: <span className="font-bold text-red-400">{tokens.them}</span>
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-4 bg-emerald-950 px-4 py-2 rounded-xl border border-emerald-800">
                            <div className="text-sm">
                                Tricks - <span className="text-yellow-300 font-bold">ඔබලා: {teamScore.us}</span> | <span className="text-red-400 font-bold">ඔවුන්: {teamScore.them}</span>
                            </div>
                            {trump && (
                                <div className="bg-emerald-800 px-3 py-1 rounded-lg text-xs font-bold border border-emerald-600 flex items-center space-x-1">
                                    <span>Trump:</span>
                                    <span className={SUIT_COLORS[trump]}>{trump} {SUIT_SYMBOLS[trump]}</span>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* STATUS DISPLAY */}
                    <div className="w-full bg-emerald-900/60 border border-emerald-700/60 rounded-xl p-3 my-2 flex items-center space-x-3 backdrop-blur text-emerald-100 text-sm font-medium">
                        <span className="text-amber-400 text-lg">📢</span>
                        <span>{statusMessage}</span>
                    </div>

                    {/* GAME TABLE */}
                    <main className="relative w-full h-[430px] bg-emerald-800 rounded-3xl border-8 border-emerald-900 shadow-2xl flex items-center justify-center overflow-hidden">
                        
                        {/* NOTIYA (NORTH / TOP) */}
                        <div className="absolute top-2 flex flex-col items-center z-10">
                            <span className={`text-xs font-bold px-3 py-1 rounded-full ${currentTurn === 2 ? 'bg-yellow-400 text-black animate-pulse' : 'bg-emerald-950 text-emerald-200'}`}>
                                Notiya (Partner)
                            </span>
                            <div className="flex space-x-1 mt-1">
                                {hands[2].map((_, i) => (
                                    <div key={i} className="w-5 h-8 bg-blue-900 rounded border border-blue-400 shadow" />
                                ))}
                            </div>
                        </div>

                        {/* NIMA (WEST / LEFT) */}
                        <div className="absolute left-2 flex flex-col items-center z-10">
                            <span className={`text-xs font-bold px-3 py-1 rounded-full ${currentTurn === 3 ? 'bg-yellow-400 text-black animate-pulse' : 'bg-emerald-950 text-emerald-200'}`}>
                                Nima
                            </span>
                            <div className="flex flex-col space-y-1 mt-1">
                                {hands[3].map((_, i) => (
                                    <div key={i} className="w-8 h-5 bg-red-900 rounded border border-red-400 shadow" />
                                ))}
                            </div>
                        </div>

                        {/* SANDU (EAST / RIGHT) */}
                        <div className="absolute right-2 flex flex-col items-center z-10">
                            <span className={`text-xs font-bold px-3 py-1 rounded-full ${currentTurn === 1 ? 'bg-yellow-400 text-black animate-pulse' : 'bg-emerald-950 text-emerald-200'}`}>
                                Sandu
                            </span>
                            <div className="flex flex-col space-y-1 mt-1">
                                {hands[1].map((_, i) => (
                                    <div key={i} className="w-8 h-5 bg-red-900 rounded border border-red-400 shadow" />
                                ))}
                            </div>
                        </div>

                        {/* PLAY AREA (4 DISTINCT SIDE POSITIONS FOR PLAYED CARDS) */}
                        <div className="relative w-72 h-72 sm:w-80 sm:h-80 bg-emerald-900/40 rounded-3xl border border-emerald-700/40 shadow-inner p-2">
                            {currentTrick.map(({ player, card }) => {
                                const posStyle = getCardPositionStyle(player);

                                return (
                                    <div
                                        key={card.id}
                                        className={`absolute w-14 h-20 sm:w-16 sm:h-24 bg-white rounded-xl border-2 border-gray-300 card-shadow flex flex-col items-center justify-between p-1.5 animate-card transition-all duration-300 ${posStyle}`}
                                    >
                                        <div className={`w-full flex justify-between items-center text-xs font-bold ${SUIT_COLORS[card.suit]}`}>
                                            <span>{card.rank}</span>
                                            <span>{SUIT_SYMBOLS[card.suit]}</span>
                                        </div>
                                        <span className={`text-2xl sm:text-3xl ${SUIT_COLORS[card.suit]}`}>{SUIT_SYMBOLS[card.suit]}</span>
                                        <div className={`w-full flex justify-between items-center text-xs font-bold ${SUIT_COLORS[card.suit]} rotate-180`}>
                                            <span>{card.rank}</span>
                                            <span>{SUIT_SYMBOLS[card.suit]}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* TRUMP SELECTION OVERLAY */}
                        {gameState === 'SELECT_TRUMP' && trumpMaker === 0 && (
                            <div className="absolute inset-0 bg-black/80 backdrop-blur flex flex-col items-center justify-center p-4 z-20">
                                <h2 className="text-xl font-bold mb-4 text-amber-300">තුරුම්පු පාට තෝරන්න (Select Trump)</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    {SUITS.map((s) => (
                                        <button
                                            key={s}
                                            onClick={() => handleSelectTrump(s)}
                                            className="bg-white text-gray-900 font-bold py-3 px-5 rounded-xl hover:bg-amber-400 transition transform hover:scale-105 shadow-lg flex items-center space-x-2"
                                        >
                                            <span className={`text-2xl ${SUIT_COLORS[s]}`}>{SUIT_SYMBOLS[s]}</span>
                                            <span>{s}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ROUND END OVERLAY */}
                        {gameState === 'ROUND_END' && (
                            <div className="absolute inset-0 bg-black/85 backdrop-blur flex flex-col items-center justify-center p-4 z-20 text-center">
                                <div className="text-5xl mb-2">🎉</div>
                                <h2 className="text-2xl font-bold mb-2 text-amber-300">{statusMessage}</h2>
                                <button
                                    onClick={startNewRound}
                                    className="mt-4 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 px-8 rounded-xl shadow-xl transition transform hover:scale-105"
                                >
                                    ඊළඟ අත පටන් ගන්න 🔄
                                </button>
                            </div>
                        )}
                    </main>

                    {/* HUMAN HAND */}
                    <footer className="w-full mt-3 flex flex-col items-center">
                        <div className="text-xs text-emerald-300 mb-1 font-semibold">
                            ඔබේ කොළ ({hands[0].length}) {currentTurn === 0 && <span className="text-yellow-400 font-bold animate-pulse">(ඔබේ වාරය!)</span>}
                        </div>
                        <div className="flex space-x-2 overflow-x-auto p-2 max-w-full">
                            {hands[0].map((card) => {
                                const validCards = getValidCards(hands[0], leadSuit);
                                const isValid = currentTurn === 0 && validCards.some(c => c.id === card.id);

                                return (
                                    <button
                                        key={card.id}
                                        onClick={() => handleHumanCardClick(card)}
                                        disabled={currentTurn !== 0 || gameState !== 'PLAYING'}
                                        className={`w-14 h-22 sm:w-16 sm:h-24 bg-white rounded-xl border-2 p-1.5 flex flex-col justify-between items-center transition transform hover:-translate-y-2 card-shadow ${
                                            isValid ? 'border-yellow-400 ring-4 ring-yellow-400/50 cursor-pointer' : 'border-gray-300 opacity-80'
                                        }`}
                                    >
                                        <div className={`w-full flex justify-between items-center text-xs font-bold ${SUIT_COLORS[card.suit]}`}>
                                            <span>{card.rank}</span>
                                            <span>{SUIT_SYMBOLS[card.suit]}</span>
                                        </div>
                                        <span className={`text-2xl sm:text-3xl ${SUIT_COLORS[card.suit]}`}>{SUIT_SYMBOLS[card.suit]}</span>
                                        <div className={`w-full flex justify-between items-center text-xs font-bold ${SUIT_COLORS[card.suit]} rotate-180`}>
                                            <span>{card.rank}</span>
                                            <span>{SUIT_SYMBOLS[card.suit]}</span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
    </html>
